version: '3.8'

# Shared infra (from feature/infra):
#   postgres  → app DB (Prisma)
#   redis     → BullMQ queue + Socket pub/sub + leaderboard ZSET
#   minio     → S3-compatible storage
#
# Compiling pipeline (this branch adds):
#   judge0-*  → code execution sandbox (server, workers, internal db & redis)

services:
  postgres:
    image: postgres:16
    container_name: bamheelab_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bamheelab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bamheelab_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: bamheelab_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ---------- Judge0 sandbox stack ----------
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: bam-judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    cgroup_parent: docker.slice
    restart: unless-stopped
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: bam-judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    cgroup_parent: docker.slice
    restart: unless-stopped
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:13-alpine
    container_name: bam-judge0-db
    env_file: ./judge0.conf
    volumes:
      - bam-judge0-pg:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:6
    container_name: bam-judge0-redis
    command:
      - sh
      - -c
      - 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    env_file: ./judge0.conf
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  bam-judge0-pg:
