# Judge0 v1.13.1 config for local dev.
# Anything sensitive here is OK to commit because this is a local-only stack.

# ---------- Judge0 server ----------
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=true
CALLBACKS_MAX_TRIES=3
CALLBACKS_TIMEOUT=5
ENABLE_ADDITIONAL_FILES=true
MAX_QUEUE_SIZE=100
USE_DOCS_AS_HOMEPAGE=false

# ---------- Postgres (used by judge0-db service) ----------
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pwd

# ---------- Redis (Judge0's internal queue/cache, NOT our BullMQ Redis) ----------
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redispwd

# Disable isolate sandbox — required for Mac (Docker/Rosetta doesn't support
# Linux kernel namespaces needed by isolate on ARM64)
ISOLATE_SANDBOX_ENABLED=false

# ---------- Sandbox limits ----------
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024
NUMBER_OF_WORKERS=2
MAX_EXTRA_CPU_TIME=5
MAX_WALL_TIME=20
MAX_MEMORY_LIMIT=512000
MAX_STACK_LIMIT=128000
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_MAX_FILE_SIZE=4096
